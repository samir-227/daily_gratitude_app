name: daily_gratitude_app
description: "A gratitude journal app for Arabic speakers with voice recording and STT."
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  record: ^6.2.1
  just_audio: ^0.10.5
  speech_to_text: ^7.4.0
  audio_session: ^0.1.21
  flutter_local_notifications: ^21.0.0
  fl_chart: ^1.2.0
  path_provider: ^2.1.5
  get_it: ^9.2.1
  go_router: ^17.2.3
  permission_handler: ^12.0.2
  uuid: ^4.5.1
  intl: ^0.20.2
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  flutter_screenutil: ^5.9.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
